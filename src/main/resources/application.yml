spring:
  application:
    name: bulkflow
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bulkflow}
    username: ${SPRING_DATASOURCE_USERNAME:bulkflow}
    password: ${SPRING_DATASOURCE_PASSWORD:bulkflow}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 500
          order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  inbox-bucket: ${MINIO_INBOX_BUCKET:bulkflow-inbox}
  processed-bucket: ${MINIO_PROCESSED_BUCKET:bulkflow-processed}
  dead-letter-bucket: ${MINIO_DL_BUCKET:bulkflow-dead-letter}

bulkflow:
  batch:
    chunk-size: 500
    skip-limit: 1000000
    retry-limit: 3
    retry-backoff-ms: 1000
  poller:
    interval-ms: 30000
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%thread] [batch_id=%X{batch_id}] [feed_type=%X{feed_type}] %logger{36} - %msg%n"
