spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///bulkflow
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  flyway:
    enabled: true
  batch:
    job:
      enabled: false

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  inbox-bucket: test-inbox
  processed-bucket: test-processed
  dead-letter-bucket: test-dead-letter

bulkflow:
  batch:
    chunk-size: 100
    skip-limit: 1000000
    retry-limit: 1
    retry-backoff-ms: 100
  poller:
    enabled: false

logging:
  level:
    com.bulkflow: DEBUG
    org.springframework.batch: INFO
