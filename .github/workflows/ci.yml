name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: ./mvnw test -Dtest="com.bulkflow.unit.*" -DfailIfNoTests=false

      - name: Run integration tests (Testcontainers spins up Postgres)
        run: ./mvnw test -Dtest="com.bulkflow.integration.*" -DfailIfNoTests=false
        env:
          SPRING_PROFILES_ACTIVE: test
          TESTCONTAINERS_REUSE_ENABLE: true

      - name: Build JAR
        run: ./mvnw clean package -DskipTests

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: bulkflow-jar
          path: target/bulkflow-*.jar
